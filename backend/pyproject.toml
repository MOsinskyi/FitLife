[tool.poetry]
name = "fitlife"
version = "0.1.0"
description = ""
authors = ["Maksym Osinskyi <maximosinskiy@gmail.com>"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
fastapi = {extras = ["standard"], version = "^0.119.0"}
pydantic-settings = "^2.11.0"
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
python-jose = "^3.5.0"
uvicorn = "^0.38.0"
aiosqlite = "^0.21.0"
sqlalchemy = "^2.0.44"
greenlet = "^3.2.4"
redis = "^7.1.0"
python-dotenv = "^1.2.1"
fastapi-cache2 = "^0.2.2"
email-validator = "^2.3.0"
alembic = "^1.18.3"
bcrypt = "4.0.1"
sqladmin = {extras = ["full"], version = "^0.23.0"}
itsdangerous = "^2.2.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-cov = "^6.0.0"
httpx = "^0.28.0"
pre-commit = "^4.0.0"
black = "^24.10.0"
isort = "^5.13.0"
ruff = "^0.8.0"
mypy = "^1.13.0"
bandit = "^1.7.0"
pytest-asyncio = "^1.3.0"

[tool.ruff]
preview = true
target-version = "py312"
line-length = 119
indent-width = 4
force-exclude = true

exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    "tests",
]

[tool.ruff.lint]
select = [
    "E", # Error
    "W", # Warning
    "F", # Pyflakes
    "I", # isort
    "B", # Bugbear
    "C4", # Comprehension
    "UP", # pyupgrade
    "PL", # Pylint
]

[tool.ruff.format]
indent-style = "space"
quote-style = "single"
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true
strict = true

exclude = [
    "venv/",
    "build/",
    "tests",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
