services:
  redis:
    image: redis:8.4-alpine
    container_name: redis_container
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - cache:/data

  db:
    image: postgres:16-alpine
    container_name: fitlife_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fitlife
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: fitlife_backend
    volumes:
      - ../backend:/app
    ports:
      - "8000:8000"
    env_file:
      - ../backend/.env.dev
    depends_on:
      - redis
      - db

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: fitlife_frontend
    volumes:
      - ../frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  cache:
    driver: local
  postgres_data:
    driver: local
