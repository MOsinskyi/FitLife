events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Docker's internal DNS resolver to avoid "host not found" on startup
    resolver 127.0.0.11 valid=30s;

    server {
        listen 80;
        server_name fitlife.space;

        location / {
            set $upstream_frontend frontend;
            proxy_pass http://$upstream_frontend:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Backend API with versioning. 
        # We strip /api/v1/ so the backend receives the path starting with /auth, /members, etc.
        location /api/v1/ {
            set $upstream_backend backend;
            proxy_pass http://$upstream_backend:8000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Admin panel direct access.
        # We pass it as /admin/ to the backend.
        location /admin/ {
            set $upstream_admin backend;
            proxy_pass http://$upstream_admin:8000/admin/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        # Fallback for other /api/ calls if any
        location /api/ {
            set $upstream_backend backend;
            proxy_pass http://$upstream_backend:8000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
