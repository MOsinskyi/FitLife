# Pre-commit hooks configuration for FitLife project
# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks

repos:
  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # File quality checks
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe] # Allow custom YAML tags
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
        args: [--maxkb=1000]

      # Python-specific checks
      - id: check-ast # Check Python syntax
      - id: check-builtin-literals
      - id: check-docstring-first
      - id: debug-statements # Check for debugger imports and breakpoints
      - id: name-tests-test
        args: [--pytest-test-first]

      # Security checks
      - id: detect-private-key

      # Merge conflict detection
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: [--fix=lf]

  # Python code formatting with Black
  - repo: https://github.com/psf/black
    rev: 25.11.0
    hooks:
      - id: black
        language_version: python3.12
        args: [--line-length=100]
        files: ^backend/

  # Import sorting with isort
  - repo: https://github.com/PyCQA/isort
    rev: 7.0.0
    hooks:
      - id: isort
        args: [--profile=black, --line-length=100]
        files: ^backend/

  # Python linting with Ruff (fast, modern alternative to flake8, pylint)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.7
    hooks:
      # Linter
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        files: ^backend/
      # Formatter (alternative to black, can be used together)
      - id: ruff-format
        files: ^backend/

  # Security vulnerability scanning
  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.2
    hooks:
      - id: bandit
        args: [-c, backend/pyproject.toml, -r, backend/src]
        pass_filenames: false
        files: ^backend/

  # Type checking with mypy
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.19.0
    hooks:
      - id: mypy
        additional_dependencies:
          - pydantic>=2.0
          - types-passlib
        args: [--ignore-missing-imports, --python-version=3.12]
        files: ^backend/src/

  # Check for common security issues in dependencies
  - repo: https://github.com/Lucas-C/pre-commit-hooks-safety
    rev: v1.4.2
    hooks:
      - id: python-safety-dependencies-check
        files: backend/pyproject.toml
        args: [--ignore=64459, --ignore=64396] # Ignore unfixable ecdsa issues

  # Prettier for YAML, JSON, Markdown formatting
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        types_or: [yaml, json, markdown]
        exclude: ^backend/poetry\.lock$

# CI configuration
ci:
  autofix_commit_msg: |
    [pre-commit.ci] auto fixes from pre-commit hooks

    for more information, see https://pre-commit.ci
  autofix_prs: true
  autoupdate_branch: ""
  autoupdate_commit_msg: "[pre-commit.ci] pre-commit autoupdate"
  autoupdate_schedule: weekly
  skip: [python-safety-dependencies-check] # Skip expensive checks in CI
  submodules: false
